# Builds FigCraft for Windows with the FigCraft Plus add-ons from this repository.
#
# Every day it looks at the latest FigCraft release. When there is one this repository hasn't built
# yet (or the custom features changed: bump CUSTOM_VERSION), it checks that release out, connects
# overlay/ and hooks/ to it (scripts/apply.py), runs the tests and publishes a portable Windows
# build under Releases. A run that fails leaves the previous release in place, and GitHub e-mails
# the repository owner.
name: Build FigCraft Plus

on:
  schedule:
    - cron: "17 4 * * *" # every day, 07:17 in Chisinau
  workflow_dispatch:
    inputs:
      figcraft_ref:
        description: "FigCraft tag or branch (empty: the latest release)"
        required: false
        default: ""
      force:
        description: "Build even if this version is already released"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "overlay/**"
      - "hooks/**"
      - "scripts/**"
      - "CUSTOM_VERSION"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: storytold/figcraft
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.p.outputs.ref }}
      release: ${{ steps.p.outputs.release }}
      plus: ${{ steps.p.outputs.plus }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.figcraft_ref }}
          FORCE: ${{ inputs.force }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="$(gh release view --repo "$UPSTREAM" --json tagName -q .tagName)"
          fi
          plus="$(tr -d '[:space:]' < CUSTOM_VERSION)"
          release="${ref}-plus.${plus}"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$FORCE" != "true" ] && gh release view "$release" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
          fi
          echo "FigCraft $ref, FigCraft Plus $plus -> $release (build: $build)"
          { echo "ref=$ref"; echo "release=$release"; echo "plus=$plus"; echo "build=$build"; } >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.ref }}
          path: figcraft
      - name: Connect custom features
        run: python3 custom/scripts/apply.py figcraft
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: figcraft
          key: test
      - name: Tests (custom features)
        working-directory: figcraft
        run: |
          cargo test --locked -p figcraft-color oklch_profile
          cargo test --locked -p figcraft-engine --lib oklch_links
          cargo test --locked -p figcraft-engine --lib var_order
          cargo test --locked -p figcraft-engine --lib style
          cargo test --locked -p figcraft-ui-egui --lib

  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    env:
      TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.plan.outputs.ref }}
          path: figcraft
      # The fonts the official release embeds: craft-fonts at the commit FigCraft's release.yml pins
      # (Inter, Roboto and the other Latin presentation fonts), not its default branch.
      - name: Craft fonts version (as the official release)
        id: fonts
        shell: bash
        run: |
          ref=$(grep -m1 -E '^\s*CRAFT_FONTS_REF:' figcraft/.github/workflows/release.yml 2>/dev/null | awk '{print $2}' | tr -d '"' || true)
          echo "craft-fonts ref: ${ref:-default branch}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: ${{ steps.fonts.outputs.ref }}
          path: craft-fonts
      - name: Connect custom features
        shell: bash
        run: python3 custom/scripts/apply.py figcraft
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: figcraft
          key: windows
      - name: Build
        working-directory: figcraft
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          # The text crate embeds the fonts: rebuild it so a cached build never ships without them.
          cargo clean --release --target $env:TARGET -p figcraft-text
          $bins = @('-p', 'figcraft')
          if (Test-Path 'apps/figcraft-cli/Cargo.toml') { $bins += @('-p', 'figcraft-cli') }
          cargo build --release --locked @bins --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
      - name: Package portable zip
        shell: pwsh
        run: |
          $ref = "${{ needs.plan.outputs.ref }}".TrimStart('v')
          $name = "figcraft-plus-${{ needs.plan.outputs.plus }}-figcraft-$ref-windows-x64-portable"
          $out = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "figcraft/target/$env:TARGET/release/*.exe" $out
          foreach ($f in 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE') {
            if (Test-Path "figcraft/$f") { Copy-Item "figcraft/$f" $out }
          }
          Get-ChildItem craft-fonts/fonts -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            $lic = Join-Path $_.FullName 'OFL.txt'
            if (Test-Path $lic) { Copy-Item $lic (Join-Path $out "OFL-$($_.Name).txt") }
          }
          Copy-Item custom/README.md (Join-Path $out 'README-FigCraft-Plus.md')
          if (Test-Path "$out/figcraft-cli.exe") { & "$out/figcraft-cli.exe" --version }
          Compress-Archive -Path $out -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"
          if-no-files-found: error

  release:
    needs: [plan, test, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          RELEASE: ${{ needs.plan.outputs.release }}
          PLUS: ${{ needs.plan.outputs.plus }}
        run: |
          # What's new: this release's section of CHANGELOG.md (if it has one).
          news=$(awk -v h="## Plus ${PLUS} " 'index($0,h)==1{on=1;next} on&&/^## /{exit} on' CHANGELOG.md)
          {
            echo "**FigCraft Plus ${PLUS}** on the official [FigCraft ${REF}](https://github.com/${UPSTREAM}/releases/tag/${REF})."
            echo
            if [ -n "$news" ]; then echo "### What's new"; echo "$news"; echo; fi
            echo "### Install"
            echo "Download the \`.zip\` below, unpack it anywhere (a USB drive is fine) and run \`figcraft.exe\`. To update, unpack over the previous version. \`.figcraft\` files stay compatible with the official app, both ways."
            echo
            echo "All add-ons: [README](https://github.com/${GITHUB_REPOSITORY}#feature-comparison) · history: [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) · next: [roadmap](https://github.com/${GITHUB_REPOSITORY}/blob/main/ROADMAP.md)"
          } > notes.md
          if gh release view "$RELEASE" >/dev/null 2>&1; then
            gh release upload "$RELEASE" dist/*.zip --clobber
            gh release edit "$RELEASE" --title "FigCraft Plus ${PLUS} · FigCraft ${REF}" --notes-file notes.md
          else
            gh release create "$RELEASE" dist/*.zip --title "FigCraft Plus ${PLUS} · FigCraft ${REF}" --notes-file notes.md --latest
          fi
